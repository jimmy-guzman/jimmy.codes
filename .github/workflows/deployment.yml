name: deployment

on: [deployment_status]

jobs:
  lighthouse:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lighthouse
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          urls: |
            ${{ github.event.deployment_status.target_url }}
            ${{ github.event.deployment_status.target_url }}/about
            ${{ github.event.deployment_status.target_url }}/blog
            ${{ github.event.deployment_status.target_url }}/blog/how-i-built-simple-blogfolio
            ${{ github.event.deployment_status.target_url }}/blog/tags
            ${{ github.event.deployment_status.target_url }}/blog/tags/typescript
            ${{ github.event.deployment_status.target_url }}/uses
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: .github/.lighthouserc.yml

  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📦 Install
        uses: ./.github/actions/install

      - name: 📦 Install Playwright Deps
        run: bunx playwright install --no-shell chromium

      - name: 🧪 Run e2e Tests
        run: bun e2e --project=chromium
        env:
          BASE_URL: ${{ github.event.deployment_status.environment_url }}
